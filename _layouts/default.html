<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#faf9f6">
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if page.layout == 'post' or page.layout == 'note' %}
    <script src="{{ '/assets/js/reading.js' | relative_url }}" defer></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到正文</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg class="brand-mark" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5.5C9.5 3.8 6.3 3.5 3 4.5v14c3.3-1 6.5-.7 9 1 2.5-1.7 5.7-2 9-1v-14c-3.3-1-6.5-.7-9 1Z"/>
          <path d="M12 5.5v14M6 8.5c1.1-.1 2.1.1 3 .5M6 12c1.1-.1 2.1.1 3 .5"/>
        </svg>
        <span>{{ site.title | escape }}</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/posts/' | relative_url }}"{% if page.url == '/posts/' or page.collection == 'posts' %} aria-current="page"{% endif %}>文章</a>
        <a href="{{ '/notes/' | relative_url }}"{% if page.url == '/notes/' or page.collection == 'notes' %} aria-current="page"{% endif %}>笔记</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
      </nav>
    </header>

    <main id="main-content" class="page-shell{% if page.layout == 'post' or page.layout == 'note' %} page-shell--reading{% endif %}" tabindex="-1">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</span>
      <div class="footer-details">
        <span>更新于 <time datetime="{{ site.time | date_to_xmlschema }}">{{ site.time | date: '%Y.%m.%d' }}</time></span>
        <span>Powered by GitHub Pages</span>
      </div>
    </footer>
  </body>
</html>
